services:
  db:
    image: postgres:16-alpine
    container_name: etraining-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: etraining
      POSTGRES_PASSWORD: etraining
      POSTGRES_DB: etraining
    ports:
      - "5432:5432"
    volumes:
      - etraining-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etraining -d etraining"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  etraining-db-data:
